# Alembic configuration. The database URL comes from Prahari settings (PRAHARI_DATABASE_URL), not this file.
[alembic]
script_location = %(here)s/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
