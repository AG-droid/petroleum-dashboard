<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Prahari · Dealer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../vendor/maplibre-gl-4.7.1/maplibre-gl.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
<link href="css/dealer.css" rel="stylesheet">
</head>
<body class="dealer">
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 16 16"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.8" fill="#111"/></svg></div>
      <span class="brand-name">Prahari</span>
      <span class="role-tag">Dealer</span>
    </div>
    <div class="tb-divider"></div>
    <div class="scope-wrap">
      <button class="area-select" id="scopeBtn" aria-haspopup="listbox" aria-expanded="false"><span id="scopeLabel">All outlets</span>
        <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--text-3)"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu hidden" id="scopeMenu" role="listbox"></div>
    </div>
    <div class="tb-right">
      <button class="fresh" id="freshBtn" aria-haspopup="dialog" title="When each source last reached Prahari"><span class="live-dot"></span><span id="freshLabel">Live</span></button>
      <div class="fresh-pop hidden" id="freshPop"></div>
      <div class="seg speed" id="speedSeg" title="Demo clock speed">
        <button data-speed="1" class="active">1×</button><button data-speed="10">10×</button><button data-speed="60">60×</button><button data-speed="300">300×</button>
      </div>
      <span id="clock" class="num"></span>
      <a class="so-link" href="../#outlet=990104" target="_blank" rel="noopener" title="Demo: the same outlets in the Sales Officer dashboard">Sales Officer view ↗</a>
      <span class="demo-tag" title="Everything shown is generated sample data">Demo data</span>
      <div class="avatar" id="avatar"></div>
    </div>
  </header>

  <nav id="rail" aria-label="Sections">
    <button data-view="today" data-label="Today" class="active"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20H4z"/><path d="M9.5 20v-5h5v5"/></svg><span class="rl">Today</span></button>
    <button data-view="outlets" data-label="Outlets"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V7l5-3 5 3v13"/><path d="M15 11h3a1 1 0 0 1 1 1v6a2 2 0 0 0 2-2V9l-2-2"/><path d="M8 9h4M8 12h4"/></svg><span class="rl">Outlets</span></button>
    <button data-view="orders" data-label="Orders"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg><span class="rl">Orders</span></button>
    <button data-view="track" data-label="Track trucks"><svg class="i" viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h4l4 4v2h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="rl">Track</span></button>
    <button data-view="account" data-label="Account"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span class="rl">Account</span></button>
    <button data-view="messages" data-label="Sales Officer"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="rl">Messages</span></button>
  </nav>

  <main id="stage">
    <div id="view" tabindex="-1"></div>
  </main>
</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="modal-box"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="tooltip"></div>

<script src="../vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
<script src="../js/roadnet.js"></script>
<script src="../js/roads.js"></script>
<script src="../js/data.js"></script>
<script src="../js/charts.js"></script>
<script src="js/config.js"></script>
<script src="js/world.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/outlet.js"></script>
<script src="js/orders.js"></script>
<script src="js/account.js"></script>
<script src="js/main.js"></script>
</body>
</html>
